<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>壓縮檔內容</title>
<style>
  :root {
    --bg: #f1f5f9; --card: #fff; --border: #e2e8f0; --text: #1e293b;
    --muted: #64748b; --accent: #2563eb; --ok: #059669; --err: #dc2626; --warn: #d97706;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif; }
  header { background: var(--card); border-bottom: 1px solid var(--border); padding: 14px 24px;
           display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; flex: 1; min-width: 200px; word-break: break-all; }
  header .sub { color: var(--muted); font-size: 12px; word-break: break-all; width: 100%; }
  main { padding: 20px 24px; max-width: 1100px; margin: 0 auto; }
  .status { padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; font-size: 14px; }
  .status.ok { background: #ecfdf5; color: var(--ok); border: 1px solid #a7f3d0; }
  .status.err { background: #fef2f2; color: var(--err); border: 1px solid #fecaca; }
  .status.warn { background: #fffbeb; color: var(--warn); border: 1px solid #fde68a; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 10px; overflow: hidden;
          box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { background: #f8fafc; color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  td.name { font-family: ui-monospace, Consolas, monospace; word-break: break-all; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .dir { color: var(--muted); }
  .summary { color: var(--muted); font-size: 13px; margin: 10px 2px; }
  .restore-box { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
                 padding: 16px 18px; margin-top: 20px; }
  .restore-box h2 { font-size: 15px; margin: 0 0 10px; }
  .restore-box label { font-size: 13px; color: var(--muted); display: block; margin: 8px 0 4px; }
  .restore-box input[type=text] { width: 100%; padding: 8px 10px; border: 1px solid var(--border);
                                  border-radius: 6px; font-size: 13px; }
  .restore-box .row { display: flex; align-items: center; gap: 14px; margin-top: 12px; flex-wrap: wrap; }
  button { border: none; border-radius: 6px; padding: 8px 16px; font-size: 13px; cursor: pointer; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:disabled { background: #93c5fd; cursor: not-allowed; }
  .check { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text); }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .err-list { color: var(--err); font-size: 12px; margin-top: 10px; word-break: break-all; }
</style>
</head>
<body>
<header>
  <h1>📦 <span id="title">壓縮檔內容</span></h1>
  <div class="sub" id="pathline"></div>
</header>
<main>
  <div id="status"></div>
  <div id="content">
    <p class="empty">載入中…</p>
  </div>
  <div class="restore-box" id="restoreBox" hidden>
    <h2>↩ 還原此壓縮檔</h2>
    <label for="destDir">還原目標資料夾（預設為原始備份目錄）</label>
    <input type="text" id="destDir" spellcheck="false">
    <div class="row">
      <label class="check"><input type="checkbox" id="overwrite" checked> 覆蓋既有檔案</label>
      <button class="btn-primary" id="restoreBtn">還原全部</button>
      <span class="summary" id="restoreInfo"></span>
    </div>
    <div class="err-list" id="restoreErr"></div>
  </div>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const archivePath = params.get('path') || '';
  const $ = (id) => document.getElementById(id);

  function fmtSize(n) {
    if (!n && n !== 0) return '—';
    if (n < 1024) return n + ' B';
    const u = ['KB', 'MB', 'GB', 'TB'];
    let v = n, i = -1;
    do { v /= 1024; i++; } while (v >= 1024 && i < u.length - 1);
    return v.toFixed(1) + ' ' + u[i];
  }

  function setStatus(type, msg) {
    const el = $('status');
    el.className = 'status ' + type;
    el.textContent = msg;
  }

  async function load() {
    if (!archivePath) {
      $('title').textContent = '缺少路徑';
      setStatus('err', '缺少 path 參數');
      $('content').innerHTML = '<p class="empty">請由檔案管理系統開啟壓縮檔。</p>';
      return;
    }
    $('pathline').textContent = archivePath;
    try {
      const res = await fetch('/api/archive?path=' + encodeURIComponent(archivePath));
      const d = await res.json();
      if (!d.ok) throw new Error(d.error || '讀取失敗');
      $('title').textContent = '📦 ' + d.name;
      render(d);
    } catch (e) {
      setStatus('err', '無法讀取壓縮檔：' + e.message);
      $('content').innerHTML = '<p class="empty">此格式可能需要 Windows 的 7-Zip 或 tar.exe 才能讀取。</p>';
      $('restoreBox').hidden = true;
    }
  }

  function render(d) {
    const rows = d.entries.map((e) => `
      <tr>
        <td class="name ${e.isDir ? 'dir' : ''}">${e.isDir ? '📁 ' : '📄 '}${escapeHtml(e.name)}</td>
        <td class="num">${e.isDir ? '—' : fmtSize(e.size)}</td>
        <td class="num">${e.compressed ? fmtSize(e.compressed) : '—'}</td>
        <td>${escapeHtml(e.method || '')}</td>
      </tr>`).join('');
    $('content').innerHTML = `
      <div class="summary">${d.count} 個項目 ｜ 合計 ${fmtSize(d.totalSize)}</div>
      <table>
        <thead><tr><th>名稱</th><th style="text-align:right">大小</th><th style="text-align:right">壓縮後</th><th>格式</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="4" class="empty">（空壓縮檔）</td></tr>'}</tbody>
      </table>`;
    // 還原區：預設目標＝.bak 的上一層（原始目錄），否則為壓縮檔所在資料夾
    const dir = archivePath.replace(/[\\/]+[^\\/]+$/, '');
    const parent = dir.replace(/[\\/]+[^\\/]+$/, '');
    $('destDir').value = /(?:^|[\\/])\.bak$/i.test(dir) ? parent : dir;
    $('restoreBox').hidden = false;
    setStatus('ok', '已列出 ' + d.count + ' 個項目');
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  async function restore() {
    const destDir = $('destDir').value.trim();
    const overwrite = $('overwrite').checked;
    if (!destDir) { setStatus('err', '請輸入還原目標資料夾'); return; }
    const btn = $('restoreBtn');
    btn.disabled = true;
    $('restoreErr').textContent = '';
    $('restoreInfo').textContent = '還原中…';
    try {
      const res = await fetch('/api/restore', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ zip: archivePath, destDir, overwrite }),
      });
      const d = await res.json();
      if (!d.ok) throw new Error(d.error || '還原失敗');
      $('restoreInfo').textContent = '';
      setStatus('ok', `還原完成：成功 ${d.restored} 個，略過 ${d.skipped} 個`);
      if (d.errors && d.errors.length) {
        $('restoreErr').textContent = '無法還原：\n' + d.errors.join('\n');
      }
    } catch (e) {
      setStatus('err', '還原失敗：' + e.message);
      $('restoreInfo').textContent = '';
    } finally {
      btn.disabled = false;
    }
  }

  $('restoreBtn').addEventListener('click', () => {
    if (!confirm('確定要將此壓縮檔的全部內容還原至指定資料夾嗎？')) return;
    restore();
  });
  load();
</script>
</body>
</html>
